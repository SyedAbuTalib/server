    
    # =======================
    # HOME PAGE
    # =======================
  - name: Home
    
    #  https://github.com/glanceapp/glance/blob/main/docs/configuration.md#pages--columns
    head-widgets: 
    # https://github.com/glanceapp/glance/blob/main/docs/configuration.md#markets
    - type: markets
      markets:
        - symbol: VOO
          name: Vanguard S&P 500
        - symbol: VTI
          name: Vanguard Total Stock Market Index Fund
        - symbol: GOOG
          name: Google
        - symbol: NVDA
          name: NVIDIA
        - symbol: AAPL
          symbol-link: https://www.google.com/search?tbm=nws&q=apple
          name: Apple         
      
      
    columns:
    
      # -----------------------
      # SMALL COLUMN
      # -----------------------
      - size: small
        widgets:
          - type: server-stats
            servers:
            - type: local
              name: "${SERVER_HOSTNAME}"
              hide-mountpoints-by-default: true
              mountpoints:
                "/mnt/storage/":
                  hide: false
                "/":
                  hide: true

    
          # https://github.com/glanceapp/glance/blob/main/docs/configuration.md#clock
          - type: clock
            hour-format: 24h
            timezones:
              - timezone: America/Los_Angeles
                label: Seattle
              - timezone: America/Chicago
                label: Dallas
              - timezone: America/New_York
                label: New York 
    
          # https://github.com/glanceapp/glance/blob/main/docs/configuration.md#calendar
          - type: calendar
            hide-header: true
            first-day-of-week: monday
          
          - type: custom-api
            title: Tailscale Devices
            title-url: https://login.tailscale.com/admin/machines
            url: https://api.tailscale.com/api/v2/tailnet/-/devices
            headers:
              Authorization: Bearer ${TAILSCALE_API_KEY}
            cache: 10m
            options:
              # collapseAfter: 4
              # disableOfflineIndicator: true
              # disableUpdateIndicator: true
              # prioritiseTags: true
            template: |
              <style>
                .device-info-container-tailscale {
                  position: relative;
                  overflow: hidden;
                  height: 1.5em;
                }

                .device-info-tailscale {
                  display: flex;
                  transition: transform 0.2s ease, opacity 0.2s ease;
                }

                .device-ip-tailscale {
                  position: absolute;
                  top: 0;
                  left: 0;
                  transform: translateY(-100%);
                  opacity: 0;
                  transition: transform 0.2s ease, opacity 0.2s ease;
                }

                .device-info-container-tailscale:hover .device-info-tailscale {
                  transform: translateY(100%);
                  opacity: 0;
                }

                .device-info-container-tailscale:hover .device-ip-tailscale {
                  transform: translateY(0);
                  opacity: 1;
                }

                .update-indicator-tailscale {
                  width: 8px;
                  height: 8px;
                  border-radius: 50%;
                  background-color: var(--color-primary);
                  display: inline-block;
                  margin-left: 4px;
                  vertical-align: middle;
                }

                .offline-indicator-tailscale {
                  width: 8px;
                  height: 8px;
                  border-radius: 50%;
                  background-color: var(--color-negative);
                  display: inline-block;
                  margin-left: 4px;
                  vertical-align: middle;
                }

                .device-name-container-tailscale {
                  display: flex;
                  align-items: center;
                  gap: 8px;
                }

                .indicators-container-tailscale {
                  display: flex;
                  align-items: center;
                  gap: 4px;
                }
              </style>
              <ul class="list list-gap-10 collapsible-container" data-collapse-after="{{ .Options.IntOr "collapseAfter" 3 }}">
                {{ range .JSON.Array "devices" }}
                <li>
                  <div class="flex items-center gap-10">
                    <div class="device-name-container-tailscale grow">
                      <span class="size-h4 block text-truncate color-primary">
                        {{ findMatch "^([^.]+)" (.String "name") }}
                      </span>
                      <div class="indicators-container-tailscale">
                        {{ if and (not ($.Options.BoolOr "disableUpdateIndicator" false)) (.Bool "updateAvailable") }}
                        <span class="update-indicator-tailscale" data-popover-type="text" data-popover-text="Update Available"></span>
                        {{ end }}

                        {{ if not ($.Options.BoolOr "disableOfflineIndicator" false) }}
                        {{ $lastSeen := .String "lastSeen" | parseTime "rfc3339" }}
                        {{ if not ($lastSeen.After (offsetNow "-10s")) }}
                        {{ $lastSeenTimezoned := $lastSeen.In now.Location }}
                        <span class="offline-indicator-tailscale" data-popover-type="text"
                          data-popover-text="Offline - Last seen {{ $lastSeenTimezoned.Format " Jan 2 3:04pm" }}"></span>
                        {{ end }}
                        {{ end }}

                      </div>
                    </div>
                  </div>
                  <div class="device-info-container-tailscale">
                    <ul class="list-horizontal-text device-info-tailscale">
                      <li>{{ .String "os" }}</li>
                      <li>
                        {{ if and ($.Options.BoolOr "prioritiseTags" false) (.Exists "tags.0") }}
                          {{ trimPrefix "tag:" (.String "tags.0") }}
                        {{ else }}
                          {{ .String "user" }}
                        {{ end }}
                      </li>
                    </ul>
                    <div class="device-ip-tailscale">
                      {{ .String "addresses.0"}}
                    </div>
                  </div>
                </li>
                {{ end }}
              </ul>
    
    
      # -----------------------
      # FULL COLUMN
      # -----------------------
      - size: full
        widgets:
    
          # https://github.com/glanceapp/glance/blob/main/docs/configuration.md#search-widget
          - type: search
            hide-header: true
            search-engine: google
            new-tab: true
            bangs:
              - title: YouTube
                shortcut: "y"
                url: https://www.youtube.com/results?search_query={QUERY}
              - title: Steam
                shortcut: "steam"
                url: https://store.steampowered.com/search/?term={QUERY}
    
    
    
    
          # https://github.com/glanceapp/glance/blob/main/docs/configuration.md#rss
          
          - type: group
            widgets:
              - type: hacker-news
                limit: 15
                collapse-after: 5
              - type: lobsters
                sort-by: hot
                tags:
                  - ruby
                  - C
                  - C++
                  - linux
                  - windows
                  - java
                  - javascript
                  - python
                  - android
                  - ios 
                  - mac 
                  - browsers
                  - email
                  - web
                  - vim
                  - vscode
                  - editors
                limit: 15
                collapse-after: 5
              - type: rss
                title: Tech News
                limit: 25
                # style: detailed-list
                collapse-after: 5
                cache: 1h
                feeds:
                  - url: https://feeds.arstechnica.com/arstechnica/index/
                  - url: https://www.theverge.com/rss/index.xml
                  - url: https://www.wired.com/feed/category/business/latest/rss
                  - url: https://www.wired.com/feed/tag/ai/latest/rss
                  - url: https://appleinsider.com/rss/news
                  - url: https://techcrunch.com/feed/
                  - url: https://www.techradar.com/feeds.xml
              - type: rss
                title: Non-Tech News
                limit: 25
                collapse-after: 5 
                cache: 1h 
                feeds:
                  - url: https://rss.nytimes.com/services/xml/rss/nyt/HomePage.xml 
                  - url: https://www.aljazeera.com/xml/rss/all.xml
                  - url: https://www.theguardian.com/world/rss 
                  - url: https://feeds.bbci.co.uk/news/rss.xml 
                  - url: https://feeds.npr.org/1001/rss.xml 

          - type: monitor
            cache: 5s
            title: Services
            sites:
              - title: Jellyfin
                url: ${SERVER_URL}:8096
                icon: si:jellyfin
              - title: Jellyseerr
                url: ${SERVER_URL}:5055
                icon: sh:jellyseerr
              - title: Radarr
                url: ${SERVER_URL}:7878
                icon: si:radarr
              - title: Sonarr
                url: ${SERVER_URL}:8989
                icon: si:sonarr
              - title: qBittorrent
                url: ${SERVER_URL}:8080
                icon: si:qbittorrent
              - title: Prowlarr
                url: ${SERVER_URL}:9696
                icon: sh:prowlarr
              - title: Recommendarr
                url: ${SERVER_URL}:3001
                icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/recomendarr.png

          - type: monitor
            cache: 1m
            title: Public Access
            sites:
              - title: ${PUBLIC_DOMAIN}
                url: https://${PUBLIC_DOMAIN}
                icon: si:jellyfin
              - title: request.${PUBLIC_DOMAIN}
                url: https://request.${PUBLIC_DOMAIN}
                icon: sh:jellyseerr

          - type: videos
            channels:
              - UC0JJtK3m8pwy6rVgnBz47Rw # Rotten Mango
              - UC2C_jShtL725hvbm1arSV9w # CGP Grey
              # - UCHnyfMqiRRG1u-2MsSQLbXA
                  
    
      # -----------------------
      # SMALL COLUMN
      # -----------------------
      - size: small
        widgets:
    
          # https://github.com/glanceapp/glance/blob/main/docs/configuration.md#weather
          - type: weather
            units: imperial
            hour-format: 12h
            location: ${WEATHER_LOCATION}
    
          # https://github.com/glanceapp/community-widgets/blob/main/widgets/random-fact/README.md
          - type: custom-api
            hide-header: true
            title: Random Fact
            cache: 3h
            url: https://uselessfacts.jsph.pl/api/v2/facts/random
            template: |
              <p class="size-h4 color-paragraph">{{ .JSON.String "text" }}</p>
          
          - type: custom-api
            title: Steam Specials
            cache: 12h
            url: https://store.steampowered.com/api/featuredcategories?cc=us
            template: |
              <ul class="list list-gap-10 collapsible-container" data-collapse-after="5">
              {{ range .JSON.Array "specials.items" }}
                {{ $header := .String "header_image" }}
                {{ $urlPrefix := "https://store.steampowered.com/sub/" }}
                {{ if findMatch "/steam/apps/" $header }}
                  {{ $urlPrefix = "https://store.steampowered.com/app/" }}
                {{ end }}
                <li>
                  <a class="size-h4 color-highlight block text-truncate" href="{{ $urlPrefix }}{{ .Int "id" }}/">{{ .String "name" }}</a>
                  <ul class="list-horizontal-text">
                    <li>{{ .Int "final_price" | toFloat | mul 0.01 | printf "$%.2f" }}</li>
                    {{ $discount := .Int "discount_percent" }}
                    <li{{ if ge $discount 40 }} class="color-positive"{{ end }}>{{ $discount }}% off</li>
                  </ul>
                </li>
              {{ end }}
              </ul>
